<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Respiração Diafragmática</title>

    <link rel="icon" href="src/clovers.png" type="image/x-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- AJUDA -->

    <div
        id="overlay"
        class="overlay"
        onclick="fecharAjuda()"
    >
        <div
            class="janela-ajuda"
            onclick="event.stopPropagation()"
        >

            <button
                class="x"
                onclick="fecharAjuda()"
            >
                ✖
            </button>

            <h2>Ajuda</h2>

            <p>
                Inspire quando a flor crescer.
            </p>

            <p>
                Expire quando a flor diminuir.
            </p>

            <img
                src="src/instructions.png"
                alt="Instruções"
            >

        </div>
    </div>

    <!-- MODOS -->

    <div
        id="overlayModos"
        class="overlay"
        onclick="fecharModos()"
    >
        <div
            class="janela-ajuda"
            onclick="event.stopPropagation()"
        >

            <button
                class="x"
                onclick="fecharModos()"
            >
                ✖
            </button>

            <h2>
                Modos de Respiração
            </h2>

            <div id="select">

                <div class="r">
                    <button onclick="modo(0)">
                        <h5>Rápido</h5>
                    </button>
                </div>

                <div class="l">
                    <button onclick="modo(1)">
                        <h5>Leve</h5>
                    </button>
                </div>

                <div class="p">
                    <button onclick="modo(2)">
                        <h5>Profundo</h5>
                    </button>
                </div>

            </div>

        </div>
    </div>

    <!-- APP -->

    <div class="app">

        <button
            class="help"
            onclick="abrirAjuda()"
        >
            ?
        </button>

        <div class="clover-container">
            <div
                id="clover"
                class="clover"
            ></div>
        </div>

        <div id="fase">
            Pressione para Iniciar
        </div>

        <div class="botoes">

            <button
                id="pp"
                onclick="comecar()"
            >
                ▶
            </button>

            <button
                onclick="abrirModos()"
            >
                ⚙️ Modos
            </button>

        </div>

    </div>

    <script src="script.js"></script>

<button id="botaoSpotify" aria-label="Mostrar ou ocultar Spotify">
<img src="src/music.png" style=" height: 25px; width: 25px; align-self: center;"></img>
</button>

<div id="spotifyContainer" class="spotify-oculto">
  <iframe
    src="https://open.spotify.com/embed/playlist/3TtbTPZBV2InE76W7wsMzD"
    width="100%"
    height="352"
    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
    loading="eager">
  </iframe>
</div>

<style>
  #botaoSpotify {
    position: fixed;
    right: 20px;
    bottom: 20px;
    width: 55px;
    height: 55px;
    border: none;
    border-radius: 50%;
    background: #1DB954;
    color: white;
    font-size: 25px;
    cursor: pointer;
    z-index: 10001;
  }

  #spotifyContainer {
    position: fixed;
    right: 20px;
    bottom: 85px;
    width: min(350px, calc(100vw - 40px));
    z-index: 10000;
    border-radius: 12px;
    overflow: hidden;
  }

  #spotifyContainer iframe {
    display: block;
    border: 0;
  }

  .spotify-oculto {
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
  }
</style>

<script>
  const botaoSpotify = document.getElementById("botaoSpotify");
  const spotifyContainer = document.getElementById("spotifyContainer");

  botaoSpotify.addEventListener("click", () => {
    spotifyContainer.classList.toggle("spotify-oculto");
  });
</script>

</body>
</html>
